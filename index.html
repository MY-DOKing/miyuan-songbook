<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>米渊的点歌台 · 金色矢车菊花神</title>
    <style>
        /* ================= 色卡定义 ================= */
        :root {
            --color-abc3ae: #abc3ae; /* 浅绿 */
            --color-ffd465: #ffd465; /* 亮黄 - 主花 */
            --color-ff9d35: #ff9d35; /* 橘黄 - 副花 */
            --color-ffc98d: #ffc98d; /* 浅橘 */
            --color-fff0c9: #fff0c9; /* 米黄 - 背景 */
            --color-dark-green: #0e4d32; /* 深绿 - 文字/花心 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        /* ================= 背景与小花朵暗纹 ================= */
        body {
            background-color: var(--color-fff0c9);
            background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffd465' fill-opacity='0.25'%3E%3Cpath d='M20 20 Q25 10 30 20 Q40 15 35 25 Q45 30 35 35 Q40 45 30 40 Q25 50 20 40 Q10 45 15 35 Q5 30 15 25 Q10 15 20 20 Z'/%3E%3Cpath d='M80 80 Q85 70 90 80 Q100 75 95 85 Q105 90 95 95 Q100 105 90 100 Q85 110 80 100 Q70 105 75 95 Q65 90 75 85 Q70 75 80 80 Z' fill='%23ff9d35'/%3E%3C/g%3E%3C/svg%3E");
            background-size: 150px 150px;
            color: var(--color-dark-green);
            overflow-x: hidden;
        }

        /* ================= 1. 加载界面 ================= */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--color-abc3ae);
            background-image: radial-gradient(var(--color-dark-green) 2px, transparent 2px);
            background-size: 30px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loading-text {
            font-size: 24px;
            font-weight: bold;
            color: var(--color-fff0c9);
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 1px 1px 0 var(--color-dark-green);
        }

        .loading-bar-container {
            width: 300px;
            height: 20px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--color-dark-green);
        }

        .loading-bar {
            width: 0%;
            height: 100%;
            background-color: var(--color-ffd465);
            transition: width 0.1s linear;
        }

        /* ================= 2. 密码输入界面 ================= */
        #password-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(171, 195, 174, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9998;
        }

        .password-box {
            background-color: var(--color-fff0c9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 90%;
            border: 4px solid var(--color-ff9d35);
            position: relative; /* 为了定位花朵 */
        }

        /* === 真实花朵图片装饰 === */
        .flower-decor::before {
            content: '';
            position: absolute;
            top: -40px;  /* 让花朵露出边框 */
            left: -40px;
            width: 100px; /* 控制图片大小 */
            height: 100px;
            background-image: url('flower.png'); /* ⚠️ 请确保图片和HTML在同一个文件夹，且名字为 flower.png */
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 10;
            pointer-events: none; /* 让鼠标可以点穿图片点到后面的按钮 */
        }

        .password-prompt {
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .password-prompt span {
            color: var(--color-ff9d35);
            font-size: 24px;
        }

        #password-input {
            width: 100%;
            padding: 12px 20px;
            font-size: 18px;
            border: 2px solid var(--color-abc3ae);
            border-radius: 30px;
            outline: none;
            margin-bottom: 20px;
            text-align: center;
            background-color: #fff;
        }

        #password-input:focus {
            border-color: var(--color-ffd465);
        }

        .btn {
            background-color: var(--color-ff9d35);
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--color-ffd465);
            color: var(--color-dark-green);
            transform: scale(1.05);
        }

        .error-msg {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        /* ================= 3. 主界面 ================= */
        #main-content {
            display: none;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            /* 为底部版权信息留出空间 */
            padding-bottom: 80px; 
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px 20px;
            background-color: var(--color-abc3ae);
            border-radius: 20px;
            border: 4px solid var(--color-fff0c9);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative; /* 为了定位花朵 */
        }

        header h1 {
            color: var(--color-dark-green);
            font-size: 32px;
            margin-bottom: 10px;
        }

        header p {
            color: var(--color-dark-green);
            font-size: 16px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 12px 20px;
            border: 2px solid var(--color-abc3ae);
            border-radius: 30px;
            font-size: 16px;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--color-ff9d35);
        }

        /* 歌曲列表网格 */
        .song-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .song-card {
            background-color: #fff;
            padding: 15px;
            border-radius: 15px;
            border-left: 6px solid var(--color-ffd465);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative; /* 为了定位花朵 */
            /* 去掉 overflow: hidden，让花朵能露出来一点 */
        }

        /* 歌曲卡片的小花装饰 */
        .song-card::before {
            content: '';
            position: absolute;
            top: -15px;
            left: -15px;
            width: 45px; /* 卡片上的花小一点 */
            height: 45px;
            background-image: url('flower.png'); /* ⚠️ 确保图片名字一致 */
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.9;
            pointer-events: none;
            z-index: 5;
        }

        .song-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-left-color: var(--color-ff9d35);
        }

        .song-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            word-break: break-all;
            padding-left: 25px; /* 给左上角的小花让位，避免文字被遮挡 */
        }

        .song-status {
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
            padding-left: 25px;
        }

        .card-btn {
            background-color: var(--color-abc3ae);
            color: var(--color-dark-green);
            border: none;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            width: 100%;
        }

        .card-btn:hover {
            background-color: var(--color-ffd465);
        }

        /* 投稿区域 */
        .submit-section {
            margin-top: 40px;
            background-color: var(--color-ffc98d);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 4px dashed var(--color-ff9d35);
            position: relative;
        }

        /* 投稿区域的左上角也加上花朵 */
        .submit-section::before {
            content: '';
            position: absolute;
            top: -45px;
            left: -45px;
            width: 120px;
            height: 120px;
            background-image: url('flower.png');
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none;
            z-index: 10;
        }

        .submit-section h2 {
            margin-bottom: 15px;
            font-size: 22px;
            padding-left: 25px;
        }

        .submit-form {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .submit-form input {
            padding: 12px 20px;
            border-radius: 30px;
            border: 2px solid var(--color-ff9d35);
            font-size: 16px;
            outline: none;
            width: 300px;
        }

        .submit-msg {
            margin-top: 15px;
            color: var(--color-dark-green);
            font-weight: bold;
            display: none;
        }

        .submitted-list {
            margin-top: 20px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
            background: rgba(255,255,255,0.5);
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
        }

        .submitted-list p {
            padding: 5px;
            border-bottom: 1px dashed #ccc;
        }

        /* ================= 4. 底部版权信息 ================= */
        .footer-copyright {
            text-align: center;
            padding: 25px 0 15px 0;
            font-size: 14px;
            color: var(--color-dark-green);
            opacity: 0.7;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- 1. 加载屏幕 -->
    <div id="loading-screen">
        <div class="loading-text">Loading...</div>
        <div class="loading-bar-container">
            <div class="loading-bar" id="loading-bar"></div>
        </div>
    </div>

    <!-- 2. 密码输入屏幕 -->
    <div id="password-screen">
        <div class="password-box flower-decor">
            <div class="password-prompt" id="password-prompt">请输入 <span>...</span></div>
            <input type="text" id="password-input" placeholder="在此输入暗号..." autocomplete="off">
            <br>
            <button class="btn" id="submit-password">验证进入</button>
            <div class="error-msg" id="error-msg">输入错误，请再试一次哦~</div>
        </div>
    </div>

    <!-- 3. 主界面 -->
    <div id="main-content">
        <header class="flower-decor">
            <h1>🎤 米渊的点歌台 🎤</h1>
            <p>点击卡片点歌，或者向下划提交你想听的歌！</p>
        </header>

        <div class="toolbar">
            <input type="text" class="search-box" id="search-input" placeholder="🔍 搜索歌曲名...">
            <span id="song-count" style="font-weight:bold; color: var(--color-dark-green);">共 88 首</span>
        </div>

        <div class="song-grid" id="song-list">
            <!-- 歌曲通过 JS 生成 -->
        </div>

        <div class="submit-section flower-decor">
            <h2>📝 我想听，但米渊没唱过的歌</h2>
            <p style="margin-bottom:15px; font-size:14px;">粉丝无门槛提交区</p>
            <div class="submit-form">
                <input type="text" id="new-song-input" placeholder="输入你想听的歌曲名称...">
                <button class="btn" id="submit-new-song">提交</button>
            </div>
            <div class="submit-msg" id="submit-msg">✨ 提交成功！米渊看到后会考虑的！</div>
            
            <div class="submitted-list" id="submitted-list">
                <p style="color:#888; text-align:center;">暂时还没有人提交哦~</p>
            </div>
        </div>
    </div>

    <!-- 4. 底部版权信息 -->
    <div class="footer-copyright">©米渊Doking出品</div>

    <script>
        // ================= 数据准备 =================
        const songList = [
            "童话镇", "Always Online", "Diamonds", "Love Story", "爱我不丢下我", 
            "Song of the Wind", "倒数", "巴拉莱卡", "至少还有你", "轻涟", 
            "Young And Beautiful", "晴天", "最好的安排", "我的歌声里", "小尖尖", 
            "句号", "虚拟", "匆匆那年", "天外来物", "怪咖", 
            "保留", "凄美地", "野人 (女版)", "如果可以", "爱人错过", 
            "你在，不在", "我用什么把你留住", "笼", "那些你很冒险的梦", "千年之恋 (Live)", 
            "一个人的风景", "未至", "夏至未至", "信仰", "白羊", 
            "第一天 (男版)", "飞云之下", "直到那一天", "三生三世", "凉凉", 
            "繁花", "思慕", "修炼爱情", "稻香", "青花瓷", 
            "传奇", "如愿", "动物世界", "最初的记忆", "隐形的翅膀", 
            "Let It Go", "Monsters", "特别的人", "下潜", "阳光下的星星", 
            "天下", "红昭愿", "红色高跟鞋", "红绣花", "南山南", 
            "隔岸", "熄灭", "安和桥", "马", "我想念", 
            "Take Me Hand", "慢慢喜欢你", "太聪明", "唯一", "蒲公英的约定", 
            "其实", "愿与愁", "黑夜问白天", "贝加尔湖畔", "失眠", 
            "下雨了", "恋人", "交换余生", "像风一样", "遇见", 
            "天外来物", "最后一页", "夏天的风", "说散就散", "新地球", 
            "光年之外", "泡沫", "主播随便唱！！！"
        ];

        const loadingScreen = document.getElementById('loading-screen');
        const loadingBar = document.getElementById('loading-bar');
        const passwordScreen = document.getElementById('password-screen');
        const mainContent = document.getElementById('main-content');
        const promptText = document.getElementById('password-prompt').querySelector('span');
        const passwordInput = document.getElementById('password-input');
        const submitPasswordBtn = document.getElementById('submit-password');
        const errorMsg = document.getElementById('error-msg');

        const passphrases = [
            "我自愿加入米渊教团",
            "米渊我爱你",
            "人美声甜的米渊",
            "我要让所有人关注米渊",
            "全世界唱歌最好听的米渊"
        ];

        let currentPassphrase = "";

        // 加载进度
        let progress = 0;
        const loadInterval = setInterval(() => {
            progress += Math.random() * 15;
            if (progress >= 100) {
                progress = 100;
                clearInterval(loadInterval);
                setTimeout(() => {
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                        showPasswordScreen();
                    }, 500);
                }, 300);
            }
            loadingBar.style.width = progress + '%';
        }, 150);

        function showPasswordScreen() {
            currentPassphrase = passphrases[Math.floor(Math.random() * passphrases.length)];
            promptText.textContent = currentPassphrase;
            passwordScreen.style.display = 'flex';
            passwordInput.focus();
        }

        function verifyPassword() {
            const inputVal = passwordInput.value.trim();
            if (inputVal === currentPassphrase) {
                passwordScreen.style.display = 'none';
                mainContent.style.display = 'block';
                renderSongs(songList);
                loadSubmittedSongs();
            } else {
                errorMsg.style.display = 'block';
                passwordInput.value = '';
                passwordInput.focus();
                passwordInput.style.transform = 'translateX(-5px)';
                setTimeout(() => passwordInput.style.transform = 'translateX(5px)', 50);
                setTimeout(() => passwordInput.style.transform = 'translateX(0)', 100);
            }
        }

        submitPasswordBtn.addEventListener('click', verifyPassword);
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') verifyPassword();
        });
        passwordInput.addEventListener('input', () => {
            errorMsg.style.display = 'none';
        });

        // ================= 主界面逻辑 =================
        const songGrid = document.getElementById('song-list');
        const searchInput = document.getElementById('search-input');
        const songCountSpan = document.getElementById('song-count');

        function renderSongs(songs) {
            songGrid.innerHTML = '';
            songCountSpan.textContent = `共 ${songs.length} 首`;
            
            if (songs.length === 0) {
                songGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 20px; color: #888;">没有找到匹配的歌曲哦~</p>';
                return;
            }

            songs.forEach((song, index) => {
                const card = document.createElement('div');
                card.className = 'song-card';
                
                const isSpecial = song.includes("随便唱");
                
                card.innerHTML = `
                    <div class="song-name">${index + 1}. ${song}</div>
                    <div class="song-status">${isSpecial ? '🎲 惊喜盲盒' : '🎵 已收入曲库'}</div>
                    <button class="card-btn" onclick="alert('已点歌：${song}\\n米渊快去准备吧！')">点这首</button>
                `;
                songGrid.appendChild(card);
            });
        }

        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            const filtered = songList.filter(song => song.toLowerCase().includes(keyword));
            renderSongs(filtered);
        });

        // ================= 粉丝投稿 =================
        const newSongInput = document.getElementById('new-song-input');
        const submitNewSongBtn = document.getElementById('submit-new-song');
        const submitMsg = document.getElementById('submit-msg');
        const submittedListDiv = document.getElementById('submitted-list');

        function loadSubmittedSongs() {
            const saved = localStorage.getItem('miyuan_submitted_songs');
            if (saved) {
                const arr = JSON.parse(saved);
                renderSubmittedList(arr);
            } else {
                submittedListDiv.innerHTML = '<p style="color:#888; text-align:center;">暂时还没有人提交哦~</p>';
            }
        }

        function renderSubmittedList(arr) {
            submittedListDiv.innerHTML = '';
            if (arr.length === 0) {
                submittedListDiv.innerHTML = '<p style="color:#888; text-align:center;">暂时还没有人提交哦~</p>';
                return;
            }
            arr.slice().reverse().forEach((item) => {
                const p = document.createElement('p');
                p.textContent = `🎵 ${item}`;
                submittedListDiv.appendChild(p);
            });
        }

        submitNewSongBtn.addEventListener('click', () => {
            const val = newSongInput.value.trim();
            if (!val) return;

            let saved = localStorage.getItem('miyuan_submitted_songs');
            let arr = saved ? JSON.parse(saved) : [];
            
            if (!arr.includes(val)) {
                arr.push(val);
                localStorage.setItem('miyuan_submitted_songs', JSON.stringify(arr));
                renderSubmittedList(arr);
            }

            newSongInput.value = '';
            submitMsg.style.display = 'block';
            setTimeout(() => {
                submitMsg.style.display = 'none';
            }, 3000);
        });

        newSongInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitNewSongBtn.click();
            }
        });
    </script>
</body>
</html>
