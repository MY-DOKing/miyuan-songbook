<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>米渊的点歌台 · 金色矢车菊花神</title>
    <style>
        /* ================= 色卡定义 ================= */
        :root {
            --color-abc3ae: #abc3ae; /* 浅绿 */
            --color-ffd465: #ffd465; /* 亮黄 - 主花 */
            --color-ff9d35: #ff9d35; /* 橘黄 - 副花 */
            --color-ffc98d: #ffc98d; /* 浅橘 */
            --color-fff0c9: #fff0c9; /* 米黄 - 背景 */
            --color-dark-green: #0e4d32; /* 深绿 - 文字/花心 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        /* ================= 背景与小花朵暗纹 ================= */
        body {
            background-color: var(--color-fff0c9);
            background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffd465' fill-opacity='0.25'%3E%3Cpath d='M20 20 Q25 10 30 20 Q40 15 35 25 Q45 30 35 35 Q40 45 30 40 Q25 50 20 40 Q10 45 15 35 Q5 30 15 25 Q10 15 20 20 Z'/%3E%3Cpath d='M80 80 Q85 70 90 80 Q100 75 95 85 Q105 90 95 95 Q100 105 90 100 Q85 110 80 100 Q70 105 75 95 Q65 90 75 85 Q70 75 80 80 Z' fill='%23ff9d35'/%3E%3C/g%3E%3C/svg%3E");
            background-size: 150px 150px;
            color: var(--color-dark-green);
            overflow-x: hidden;
        }

        /* ================= 1. 加载界面 ================= */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--color-abc3ae);
            background-image: radial-gradient(var(--color-dark-green) 2px, transparent 2px);
            background-size: 30px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loading-text {
            font-size: 24px;
            font-weight: bold;
            color: var(--color-fff0c9);
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 1px 1px 0 var(--color-dark-green);
        }

        .loading-bar-container {
            width: 300px;
            height: 20px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--color-dark-green);
        }

        .loading-bar {
            width: 0%;
            height: 100%;
            background-color: var(--color-ffd465);
            transition: width 0.1s linear;
        }

        /* ================= 2. 登录界面（填昵称） ================= */
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            /* 暗号页背景：白色波点，菱形交错排布 */
            background-color: var(--color-abc3ae);
            background-image: radial-gradient(#ffffff 8%, transparent 8%), radial-gradient(#ffffff 8%, transparent 8%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9998;
        }

        .login-box {
            background-color: var(--color-fff0c9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 90%;
            width: 400px;
            border: 4px solid var(--color-ff9d35);
            position: relative;
        }

        .flower-decor::before {
            content: '';
            position: absolute;
            top: -40px;
            left: -40px;
            width: 100px;
            height: 100px;
            background-image: url('flower.png');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 10;
            pointer-events: none;
        }

        .login-prompt {
            font-size: 22px;
            margin-bottom: 20px;
            font-weight: bold;
            color: var(--color-dark-green);
        }

        .login-prompt span {
            color: var(--color-ff9d35);
            display: block;
            font-size: 16px;
            margin-top: 8px;
        }

        #nickname-input {
            width: 100%;
            padding: 14px 20px;
            font-size: 18px;
            border: 3px solid var(--color-abc3ae);
            border-radius: 30px;
            outline: none;
            margin-bottom: 25px;
            text-align: center;
            background-color: #fff;
            color: var(--color-dark-green);
        }

        #nickname-input:focus {
            border-color: var(--color-ffd465);
        }

        .login-btn {
            background-color: var(--color-ffd465);
            color: var(--color-dark-green);
            border: 3px solid var(--color-ff9d35);
            padding: 14px 40px;
            font-size: 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 0 var(--color-ff9d35);
            width: 100%;
        }

        .login-btn:hover {
            background-color: #fff0c9;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 var(--color-ff9d35);
        }

        .login-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--color-ff9d35);
        }

        /* ================= 3. 主界面 ================= */
        #main-content {
            display: none;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding-bottom: 80px; 
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px 20px;
            background-color: var(--color-abc3ae);
            border-radius: 20px;
            border: 4px solid var(--color-fff0c9);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
        }

        header h1 {
            color: var(--color-dark-green);
            font-size: 32px;
            margin-bottom: 10px;
        }

        header p {
            color: var(--color-dark-green);
            font-size: 16px;
        }

        .user-greeting {
            font-size: 14px;
            color: var(--color-dark-green);
            background-color: var(--color-ffd465);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            margin-top: 15px;
            font-weight: bold;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            min-width: 250px;
        }

        .search-box {
            width: 100%;
            padding: 12px 45px 12px 20px;
            border: 2px solid var(--color-abc3ae);
            border-radius: 30px;
            font-size: 16px;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--color-ff9d35);
        }

        .clear-search-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 20px;
            color: var(--color-ff9d35);
            cursor: pointer;
            display: none;
            padding: 0 5px;
            line-height: 1;
        }

        .clear-search-btn:hover {
            color: var(--color-dark-green);
        }

        /* 歌曲列表网格 */
        .song-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
        }

        .song-card {
            background-color: #fff;
            padding: 15px;
            border-radius: 15px;
            border-left: 6px solid var(--color-ffd465);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            height: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .song-card::before {
            content: '';
            position: absolute;
            top: -15px;
            left: -15px;
            width: 45px;
            height: 45px;
            background-image: url('flower.png');
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.9;
            pointer-events: none;
            z-index: 5;
        }

        .song-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-left-color: var(--color-ff9d35);
        }

        .song-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            word-break: break-all;
            padding-left: 25px;
            line-height: 1.4;
        }

        .song-status {
            font-size: 12px;
            color: #888;
            margin-bottom: 15px;
            padding-left: 25px;
            line-height: 1.4;
        }

        .card-btn {
            background-color: var(--color-abc3ae);
            color: var(--color-dark-green);
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            width: 100%;
            font-size: 14px;
            margin-top: auto;
        }

        .card-btn:hover {
            background-color: var(--color-ffd465);
        }

        /* 投稿区域 */
        .submit-section {
            margin-top: 40px;
            background-color: var(--color-ffc98d);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 4px dashed var(--color-ff9d35);
            position: relative;
        }

        .submit-section::before {
            content: '';
            position: absolute;
            top: -45px;
            left: -45px;
            width: 120px;
            height: 120px;
            background-image: url('flower.png');
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none;
            z-index: 10;
        }

        .submit-section h2 {
            margin-bottom: 15px;
            font-size: 22px;
            padding-left: 25px;
        }

        .submit-form {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .submit-form input {
            padding: 12px 20px;
            border-radius: 30px;
            border: 2px solid var(--color-ff9d35);
            font-size: 16px;
            outline: none;
            width: 300px;
        }

        /* 全局轻提示（Toast） */
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background-color: var(--color-dark-green);
            color: var(--color-fff0c9);
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 10000;
            pointer-events: none;
        }

        .toast-msg.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 提交成功的轻提示 */
        .submitted-list {
            margin-top: 20px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
            background: rgba(255,255,255,0.5);
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
        }

        .submitted-list p {
            padding: 5px;
            border-bottom: 1px dashed #ccc;
        }

        /* ================= 4. 底部版权信息 ================= */
        .footer-copyright {
            text-align: center;
            padding: 25px 0 15px 0;
            font-size: 14px;
            color: var(--color-dark-green);
            opacity: 0.7;
            letter-spacing: 1px;
        }

        /* ================= 5. 自定义弹窗（点歌确认） ================= */
        .custom-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
            z-index: 10001;
            justify-content: center;
            align-items: center;
        }

        .custom-modal.show {
            display: flex;
        }

        .modal-content {
            background-color: var(--color-fff0c9);
            padding: 35px 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
            width: 400px;
            border: 4px solid var(--color-ff9d35);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content::before {
            content: '';
            position: absolute;
            top: -30px;
            left: -30px;
            width: 80px;
            height: 80px;
            background-image: url('flower.png');
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none;
        }

        .modal-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: bold;
            color: var(--color-dark-green);
            margin-bottom: 10px;
        }

        .modal-song-name {
            font-size: 18px;
            color: var(--color-ff9d35);
            font-weight: bold;
            margin-bottom: 20px;
            word-break: break-all;
        }

        .modal-input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid var(--color-abc3ae);
            border-radius: 20px;
            font-size: 16px;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
        }

        .modal-input:focus {
            border-color: var(--color-ffd465);
        }

        .modal-btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .modal-btn {
            background-color: var(--color-abc3ae);
            color: var(--color-dark-green);
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            flex: 1;
        }

        .modal-btn:hover {
            background-color: var(--color-ffd465);
        }

        .modal-btn-confirm {
            background-color: var(--color-ff9d35);
            color: #fff;
        }

        .modal-btn-confirm:hover {
            background-color: var(--color-ffd465);
            color: var(--color-dark-green);
        }

        /* ================= 6. 全新的投稿提交按钮样式 ================= */
        .submit-btn-new {
            background-color: var(--color-abc3ae);
            color: var(--color-dark-green);
            border: 3px solid var(--color-dark-green);
            padding: 12px 35px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 var(--color-dark-green);
        }

        .submit-btn-new:hover {
            background-color: var(--color-ffd465);
            transform: translateY(-2px);
            box-shadow: 0 6px 0 var(--color-dark-green);
        }

        .submit-btn-new:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--color-dark-green);
        }

        /* 针对小屏幕手机优化 */
        @media (max-width: 600px) {
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .search-wrapper {
                width: 100%;
            }
            .submit-form {
                flex-direction: column;
                align-items: center;
            }
            .submit-form input {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- 1. 加载屏幕 -->
    <div id="loading-screen">

    <!-- 2. 登录屏幕（填昵称） -->
    <div id="login-screen">
        <div class="login-box flower-decor">
            <div class="login-prompt">
                请告诉我你是谁？
                <span>（方便米渊知道是谁点的歌哦~）</span>
            </div>
            <input type="text" id="nickname-input" placeholder="输入你的昵称/抖音名..." autocomplete="off">
            <button class="login-btn" id="login-btn">💛 进入点歌台</button>
        </div>
    </div>

    <!-- 3. 主界面 -->
    <div id="main-content">
        <header class="flower-decor">
            <h1>🎤 米渊的点歌台 🎤</h1>
            <p>点击卡片点歌，或者向下划提交你想听的歌！</p>
            <div class="user-greeting" id="user-greeting">欢迎，神秘人</div>

        <div class="toolbar">

            <span id="song-count" style="font-weight:bold; color: var(--color-dark-green);">共 88 首</span>
        </div>

        <div class="song-grid" id="song-list">
            <!-- 歌曲通过 JS 生成 -->
        </div>

        <!-- 投稿区域：使用 FormSubmit 发邮件 -->
        <div class="submit-section flower-decor">
            <h2>📝 我想听，但米渊没唱过的歌</h2>
            <p style="margin-bottom:15px; font-size:14px;">粉丝无门槛提交区</p>
            
            <!-- 把 action 里的邮箱换成你自己的！ -->
            <form action="https://formsubmit.co/348615486a92bb1755783cf2ddb4430c" method="POST" class="submit-form" id="submit-form">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_subject" value="米渊点歌台 - 新歌投稿">
                <!-- 提交后跳转回你现在的网页 -->
                <input type="hidden" name="_next" value="https://my-doking.github.io/miyuan-songbook/">
                
                <!-- 自动带上当前用户的昵称 -->
                <input type="hidden" name="nickname" id="hidden-nickname" value="">
                
                <input type="text" name="song" id="new-song-input" placeholder="输入你想听的歌曲名称..." required>
                <button type="submit" class="submit-btn-new">提交</button>
            </form>

            <div class="submitted-list" id="submitted-list">
                <p style="color:#888; text-align:center;">暂时还没有人提交哦~</p>
            </div>
        </div>
    </div>

    <!-- 4. 底部版权信息 -->
    <div class="footer-copyright">©米渊Doking出品</div>

    <!-- 5. 自定义点歌弹窗（带确认发送） -->
    <div class="custom-modal" id="custom-modal">
        <div class="modal-content">
            <div class="modal-icon">🎵</div>
            <div class="modal-title">确认点歌</div>
            <div class="modal-song-name" id="modal-song-name">《晴天》</div>
            
            <!-- 用一个隐藏的 form 来发送点歌请求 -->
            <form action="https://formsubmit.co/348615486a92bb1755783cf2ddb4430c" method="POST" id="card-submit-form">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_subject" value="米渊点歌台 - 卡片点歌">
                <input type="hidden" name="_next" value="https://my-doking.github.io/miyuan-songbook/">
                
                <input type="hidden" name="nickname" id="modal-nickname" value="">
                <input type="hidden" name="song" id="modal-hidden-song" value="">
                
                <!-- 显示当前点歌人昵称 -->
                <div style="font-size: 14px; color: #888; margin-bottom: 10px;">
                    点歌人：<span id="modal-display-nickname" style="color: var(--color-ff9d35); font-weight: bold;">神秘人</span>
                </div>

                <div class="modal-btn-group">
                    <button type="button" class="modal-btn" id="modal-cancel-btn">取消</button>
                    <button type="submit" class="modal-btn modal-btn-confirm">确认发送</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 6. 全局轻提示（Toast） -->
    <div class="toast-msg" id="toast-msg">✨ 提交成功！米渊看到后会考虑的！</div>

            "光年之外", "泡沫", "空心", "夜空中最亮的星", "永不失联的爱", 
            "someone you loved", "the Other Side of Paradise", 
             "我怀念的",  "我不难过",  "All Falls Down",  "搁浅", "主播随便唱！！！"
        ];

        // DOM 元素
        const loadingScreen = document.getElementById('loading-screen');
        const loadingBar = document.getElementById('loading-bar');
        const loginScreen = document.getElementById('login-screen');
        const mainContent = document.getElementById('main-content');
        const nicknameInput = document.getElementById('nickname-input');
        const loginBtn = document.getElementById('login-btn');
        const userGreeting = document.getElementById('user-greeting');
        const hiddenNickname = document.getElementById('hidden-nickname');

        let currentNickname = "神秘人";

        // 加载进度
        let progress = 0;
        const loadInterval = setInterval(() => {
            progress += Math.random() * 15;
            if (progress >= 100) {
                progress = 100;
                clearInterval(loadInterval);
                setTimeout(() => {
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                        loginScreen.style.display = 'flex'; // 显示登录界面
                    }, 500);
                }, 300);
            }
            loadingBar.style.width = progress + '%';
        }, 150);

        // 登录按钮逻辑
        loginBtn.addEventListener('click', () => {
            const name = nicknameInput.value.trim();
            if (!name) {
                alert("请输入昵称，让米渊知道是谁哦~");
                return;
            }
            currentNickname = name;
            
            // 更新界面
            loginScreen.style.display = 'none';
            mainContent.style.display = 'block';
            userGreeting.textContent = `✨ 欢迎，${currentNickname}`;
            hiddenNickname.value = currentNickname; // 同步给投稿表单的隐藏域
            
            renderSongs(songList);
            loadSubmittedSongs();
            // 记录到本地，方便提交后回显
            localStorage.setItem('miyuan_current_user', currentNickname);
        });

        // 如果本地有记录，自动填充输入框（但不能直接跳过登录，因为FormSubmit第一次还是要用户点）
        const savedUser = localStorage.getItem('miyuan_current_user');
        if (savedUser) {
            nicknameInput.value = savedUser;
        }

        // ================= 主界面逻辑 =================
        const songGrid = document.getElementById('song-list');
        const searchInput = document.getElementById('search-input');
        const clearSearchBtn = document.getElementById('clear-search-btn');
        const songCountSpan = document.getElementById('song-count');

        // 弹窗元素
        const customModal = document.getElementById('custom-modal');
        const modalSongName = document.getElementById('modal-song-name');
        const modalNickname = document.getElementById('modal-nickname');
        const modalDisplayNickname = document.getElementById('modal-display-nickname');
        const modalHiddenSong = document.getElementById('modal-hidden-song');
        const modalCancelBtn = document.getElementById('modal-cancel-btn');

        // 全局轻提示
        const toastMsg = document.getElementById('toast-msg');
        function showToast(msg) {
            toastMsg.textContent = msg;
            toastMsg.classList.add('show');
            setTimeout(() => {
                toastMsg.classList.remove('show');
            }, 3000);
        }

        function renderSongs(songs) {
            songGrid.innerHTML = '';
            songCountSpan.textContent = `共 ${songs.length} 首`;
            
            if (songs.length === 0) {
                songGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 20px; color: #888;">没有找到匹配的歌曲哦~</p>';
                return;
            }

            songs.forEach((song, index) => {
                const card = document.createElement('div');
                card.className = 'song-card';
                
                const isSpecial = song.includes("随便唱");
                
                card.innerHTML = `
                    <div class="song-name">${index + 1}. ${song}</div>
                    <div class="song-status">${isSpecial ? '🎲 惊喜盲盒' : '🎵 已收入曲库'}</div>
                    <button class="card-btn" data-song="${song}">点这首</button>
                `;
                songGrid.appendChild(card);
            });

            document.querySelectorAll('.card-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const songName = e.target.getAttribute('data-song');
                    
                    // 填充弹窗
                    modalSongName.textContent = `《${songName}》`;
                    modalHiddenSong.value = songName;
                    modalNickname.value = currentNickname;
                    modalDisplayNickname.textContent = currentNickname;
                    
                    customModal.classList.add('show');
                });
            });
        }

        // 关闭弹窗
        modalCancelBtn.addEventListener('click', () => {
            customModal.classList.remove('show');
        });
        customModal.addEventListener('click', (e) => {
            if (e.target === customModal) {
                customModal.classList.remove('show');
            }
        });

        // 搜索逻辑
        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            const filtered = songList.filter(song => song.toLowerCase().includes(keyword));
            renderSongs(filtered);
            
            if (keyword.length > 0) {
                clearSearchBtn.style.display = 'block';
            } else {
                clearSearchBtn.style.display = 'none';
            }
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearSearchBtn.style.display = 'none';
            renderSongs(songList);
            searchInput.focus();
        });

        // ================= 粉丝投稿 =================
        const submittedListDiv = document.getElementById('submitted-list');

        function loadSubmittedSongs() {
            const saved = localStorage.getItem('miyuan_submitted_songs');
            if (saved) {
                const arr = JSON.parse(saved);
                renderSubmittedList(arr);
            } else {
                submittedListDiv.innerHTML = '<p style="color:#888; text-align:center;">暂时还没有人提交哦~</p>';
            }
        }

        function renderSubmittedList(arr) {
            submittedListDiv.innerHTML = '';
            if (arr.length === 0) {
                submittedListDiv.innerHTML = '<p style="color:#888; text-align:center;">暂时还没有人提交哦~</p>';
                return;
            }
            arr.slice().reverse().forEach((item) => {
                const p = document.createElement('p');
                p.textContent = `🎵 ${item}`;
                submittedListDiv.appendChild(p);
            });
        }

        // 注意：因为 FormSubmit 会直接提交表单，页面会跳转（或者用 _next 跳回来）
        // 所以这里不需要用 JS 拦截提交，我们只需要在提交前把数据存到本地列表中即可
        document.getElementById('submit-form').addEventListener('submit', () => {
            const songVal = document.getElementById('new-song-input').value.trim();
            if (songVal) {
                let saved = localStorage.getItem('miyuan_submitted_songs');
                let arr = saved ? JSON.parse(saved) : [];
                if (!arr.includes(songVal)) {
                    arr.push(songVal);
                    localStorage.setItem('miyuan_submitted_songs', JSON.stringify(arr));
                    renderSubmittedList(arr);
                }
            }
        });
    </script>
</body>
</html>
